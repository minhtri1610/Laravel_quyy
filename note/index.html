<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chùa Phước Lộc</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('background-image.jpg') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
        }
        .container-lotus {
            position: relative;
            width: 400px;
            height: 400px;
        }
        .lotus {
            width: 100%;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .button-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed rgba(255, 215, 0, 0.7);
            border-radius: 50%;
        }
        .button {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #8B5E3C;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
            animation: orbit 5s linear infinite;
            white-space: nowrap;
        }
        .button i {
            font-size: 24px;
            transition: margin-right 0.3s ease-in-out;
        }
        .button .text {
            opacity: 0;
            width: 0;
            transition: opacity 0.3s ease-in-out, width 0.3s ease-in-out;
        }
        .button:hover, .button:focus {
            width: 180px;
            height: 50px;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 1);
            justify-content: flex-start;
            padding-left: 20px;
            outline: none;
        }
        .button:hover .text, .button:focus .text {
            opacity: 1;
            width: auto;
            margin-left: 10px;
        }

        /* Animation quay vòng */
        @keyframes orbit {
            0% { transform: rotate(0deg) translateX(150px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(150px) rotate(-360deg); }
        }
        .button:nth-child(1) { animation-delay: 0s; }
        .button:nth-child(2) { animation-delay: 1.67s; }
        .button:nth-child(3) { animation-delay: 3.33s; }
    </style>
</head>
<body>
    <h1 style="color: #FFD700; text-shadow: 2px 2px 5px rgba(255, 215, 0, 0.8);">CHÙA PHƯỚC LỘC</h1>
    <div class="container">
        <img src="lotus.png" alt="Hoa Sen" class="lotus">
        <div class="button-container">
            <button class="button">
                <i class="bi bi-heart-fill"></i>
                <span class="text">Đăng Ký Quy Y</span>
            </button>
            <button class="button">
                <i class="bi bi-emoji-smile-fill"></i>
                <span class="text">Đăng Ký Cầu An</span>
            </button>
            <button class="button">
                <i class="bi bi-lightning-fill"></i>
                <span class="text">Đăng Ký Cầu Siêu</span>
            </button>
        </div>
    </div>

    <script>
        const buttons = document.querySelectorAll('.button');

        buttons.forEach(button => {
            button.addEventListener('mouseenter', () => {
                buttons.forEach(btn => btn.style.animationPlayState = 'paused');
            });

            button.addEventListener('mouseleave', () => {
                buttons.forEach(btn => btn.style.animationPlayState = 'running');
            });
        });
    </script>
</body>
</html>
